databases:
  - name: agrinova-db
    plan: free
    databaseName: agrinova
    user: agrinova

services:
  - type: web
    name: agrinova
    plan: free
    runtime: python

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate

    startCommand: gunicorn agrinova.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: agrinova-db
          property: connectionString

      - key: GROQ_API_KEY
        sync: false

      - key: GEMINI_API_KEY
        sync: false

      - key: ALLOWED_HOSTS
        sync: false