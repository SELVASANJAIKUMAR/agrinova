{% extends 'base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card auth-card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock display-4" style="color: var(--agri-green);"></i>
                    <h2 class="mt-2">Set New Password</h2>
                </div>
                <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit" class="btn btn-success w-100">Reset Password</button></form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
