{% extends 'base.html' %}
{% block title %}Delete Listing{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="alert alert-warning p-4 text-center">
            <i class="bi bi-exclamation-triangle display-4"></i>
            <h4 class="mt-3">Delete "{{ object.crop.name }}" listing?</h4>
            <p class="text-muted mb-3">This action cannot be undone.</p>
            <form method="post">{% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'marketplace:listing_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
