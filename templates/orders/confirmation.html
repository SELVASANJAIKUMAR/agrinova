{% extends 'base.html' %}
{% block title %}Order Confirmed{% endblock %}
{% block content %}
<div class="alert alert-success text-center p-5">
    <i class="bi bi-check-circle display-1"></i>
    <h2 class="mt-3">Order Placed — Payment Simulated</h2>
    <p class="lead">Order #{{ order.id }} has been confirmed.</p>
    <p>Total: ₹{{ order.total_amount }} | Status: {{ order.get_status_display }}</p>
    <a href="{% url 'orders:history' %}" class="btn btn-success">View Order History</a>
    <a href="{% url 'marketplace:listing_list' %}" class="btn btn-outline-success">Continue Shopping</a>
</div>
{% endblock %}
