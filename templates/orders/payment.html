{% extends 'base.html' %}
{% block title %}Payment{% endblock %}
{% block content %}
<h1>Simulate Payment</h1>
<div class="card shadow-sm"><div class="card-body text-center p-5">
    <i class="bi bi-credit-card display-1 text-success"></i>
    <h3 class="mt-3">Order #{{ order.id }}</h3>
    <p class="lead">Total: ₹{{ order.total_amount }}</p>
    <p class="text-muted">This is a test payment — no real transaction will occur.</p>
    <form method="post">{% csrf_token %}
        <button type="submit" class="btn btn-success btn-lg">Confirm Test Payment</button>
    </form>
</div></div>
{% endblock %}
